<!DOCTYPE html>
<html lang="en">
<head>
	<script src="files/scripts/main.js" defer></script>
	<link href="Https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css" rel="stylesheet">
	<link href="files/styles/main.css" rel="stylesheet">
	<title>JSON Pro</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="apple-touch-icon" sizes="180x180" href="files/images/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="files/images/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="files/images/favicon-16x16.png">
	<link rel="manifest" href="files/images/site.webmanifest">
	<link rel="mask-icon" href="files/images/safari-pinned-tab.svg" color="#ffc221">
	<link rel="shortcut icon" href="files/images/favicon.ico">
	<meta name="msapplication-TileColor" content="#da532c">
	<meta name="msapplication-config" content="files/images/browserconfig.xml">
	<meta name="theme-color" content="#ffffff">
	<meta name="theme-color" content="#ffc221">
</head>
<body>
	
	<main>
		<div id="wrapper">
			<pre id="lines">1</pre>
			<div id="layer-group">
				<pre id="code" contenteditable="true" spellcheck="false" autofocus></pre>
				<pre id="punctuation" inert aria-hidden="true"></pre>
				<pre id="attr" inert aria-hidden="true"></pre>
				<pre id="string" inert aria-hidden="true"></pre>
				<pre id="literal" inert aria-hidden="true"></pre>
				<pre id="number" inert aria-hidden="true"></pre>
				<pre id="error-notification" inert aria-hidden="true"></pre>
			</div>
		</div>
	</main> 
	<footer>
		<img src="files/images/favicon.ico" />
	</footer>
</body>
</html>
